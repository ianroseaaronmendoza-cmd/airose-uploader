name: Scheduled Upload (Headless)

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Comma-separated platforms (youtube,igfb,pinterest)"
        required: false
        default: "youtube,igfb"
      dry_run:
        description: "Run without uploading or writing metadata"
        required: false
        type: boolean
        default: false
  schedule:
    # GitHub Actions cron uses UTC. Runs every 6.15 hours (6 hours 9 minutes)
    # Each schedule slot uses a different preset:
    # 00:00 UTC -> faith preset
    # 06:09 UTC -> love preset
    # 12:18 UTC -> sentimental preset
    # 18:27 UTC -> neutral preset
    - cron: "0 0 * * *"
    - cron: "9 6 * * *"
    - cron: "18 12 * * *"
    - cron: "27 18 * * *"

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      UPLOADER_METADATA_FOLDER: ${{ vars.UPLOADER_METADATA_FOLDER }}
      UPLOADER_VIDEO_FOLDER: ${{ vars.UPLOADER_VIDEO_FOLDER }}
      GOOGLE_DRIVE_METADATA_FOLDER_URL: ${{ vars.GOOGLE_DRIVE_METADATA_FOLDER_URL }}
      GOOGLE_DRIVE_VIDEO_FOLDER_URL: ${{ vars.GOOGLE_DRIVE_VIDEO_FOLDER_URL }}
      DRIVE_SERVICE_ACCOUNT_PATH: google_service_account.json
      DEFAULT_PLATFORMS: youtube,igfb
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-headless.txt

      - name: Materialize Auth Files
        env:
          YOUTUBE_CREDENTIALS_JSON_B64: ${{ secrets.YOUTUBE_CREDENTIALS_JSON_B64 }}
          YOUTUBE_TOKEN_PKL_B64: ${{ secrets.YOUTUBE_TOKEN_PKL_B64 }}
          META_CREDENTIALS_JSON_B64: ${{ secrets.META_CREDENTIALS_JSON_B64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          python - <<'PY'
          import base64
          import binascii
          import json
          import os
          from pathlib import Path

          mappings = {
              "YOUTUBE_CREDENTIALS_JSON_B64": ("credentials.json", "json"),
              "YOUTUBE_TOKEN_PKL_B64": ("token.pkl", "binary"),
              "META_CREDENTIALS_JSON_B64": ("meta_credentials.json", "json"),
          }
          optional_mappings = {
              "GOOGLE_SERVICE_ACCOUNT_JSON_B64": ("google_service_account.json", "json"),
          }

          def decode_secret(env_key: str, value_kind: str) -> bytes | None:
              value = (os.environ.get(env_key) or "").strip()
              if not value:
                  return None

              if value_kind == "json" and value[:1] in "{[":
                  try:
                      json.loads(value)
                  except json.JSONDecodeError as exc:
                      raise SystemExit(
                          f"GitHub Secret {env_key} looks like raw JSON but is invalid: {exc}"
                      ) from exc
                  return value.encode("utf-8")

              try:
                  return base64.b64decode(value, validate=True)
              except binascii.Error as exc:
                  if value_kind == "json":
                      raise SystemExit(
                          f"GitHub Secret {env_key} is invalid. "
                          "Provide either raw JSON text or the full single-line base64 value."
                      ) from exc
                  raise SystemExit(
                      f"GitHub Secret {env_key} is invalid base64. "
                      "Recreate it from the original file bytes and paste the full single-line value."
                  ) from exc

          missing = [key for key in mappings if not (os.environ.get(key) or "").strip()]
          if missing:
              raise SystemExit(
                  "Missing required GitHub Secrets: " + ", ".join(sorted(missing))
              )

          for env_key, (file_path, value_kind) in mappings.items():
              raw = decode_secret(env_key, value_kind)
              if raw is None:
                  raise SystemExit(f"Missing required GitHub Secret: {env_key}")
              Path(file_path).write_bytes(raw)
              print(f"Wrote {file_path}")

          for env_key, (file_path, value_kind) in optional_mappings.items():
              raw = decode_secret(env_key, value_kind)
              if raw is None:
                  continue
              Path(file_path).write_bytes(raw)
              print(f"Wrote {file_path}")
          PY

      - name: Normalize Drive Config
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          meta_path = Path("meta_credentials.json")
          service_account_path = Path("google_service_account.json")
          if not meta_path.exists() or not service_account_path.exists():
              raise SystemExit(0)

          data = json.loads(meta_path.read_text(encoding="utf-8"))
          desired = service_account_path.name
          if data.get("google_service_account_json") == desired:
              raise SystemExit(0)

          data["google_service_account_json"] = desired
          meta_path.write_text(json.dumps(data, indent=2), encoding="utf-8")
          print("Updated meta_credentials.json to use google_service_account.json")
          PY

      - name: Sync Google Drive Folders
        if: ${{ env.GOOGLE_DRIVE_METADATA_FOLDER_URL != '' || env.GOOGLE_DRIVE_VIDEO_FOLDER_URL != '' }}
        shell: bash
        run: |
          if [ ! -f "$DRIVE_SERVICE_ACCOUNT_PATH" ]; then
            echo "GOOGLE_SERVICE_ACCOUNT_JSON_B64 secret is required for Google Drive folder sync."
            exit 1
          fi

          if [ -n "$GOOGLE_DRIVE_METADATA_FOLDER_URL" ]; then
            METADATA_DIR="$GITHUB_WORKSPACE/.runtime/metadata"
            mkdir -p "$METADATA_DIR"
            python drive_folder_sync.py pull \
              --folder-url "$GOOGLE_DRIVE_METADATA_FOLDER_URL" \
              --dest "$METADATA_DIR" \
              --service-account-json "$DRIVE_SERVICE_ACCOUNT_PATH" \
              --extensions .json \
              --clear-dest
            echo "UPLOADER_METADATA_FOLDER=$METADATA_DIR" >> "$GITHUB_ENV"
          fi

          if [ -n "$GOOGLE_DRIVE_VIDEO_FOLDER_URL" ]; then
            VIDEO_DIR="$GITHUB_WORKSPACE/.runtime/videos"
            mkdir -p "$VIDEO_DIR"
            python drive_folder_sync.py pull \
              --folder-url "$GOOGLE_DRIVE_VIDEO_FOLDER_URL" \
              --dest "$VIDEO_DIR" \
              --service-account-json "$DRIVE_SERVICE_ACCOUNT_PATH" \
              --extensions .mp4,.mov,.m4v \
              --clear-dest
            echo "UPLOADER_VIDEO_FOLDER=$VIDEO_DIR" >> "$GITHUB_ENV"
          fi

      - name: Refresh YouTube Token
        shell: bash
        run: |
          PLATFORMS_INPUT="${{ github.event.inputs.platforms }}"

          if [ -z "$PLATFORMS_INPUT" ]; then
            PLATFORMS_INPUT="$DEFAULT_PLATFORMS"
          fi

          if [[ ",$PLATFORMS_INPUT," == *",youtube,"* ]]; then
            python refresh_youtube_token.py
          else
            echo "YouTube not selected; skipping token refresh."
          fi

      - name: Check YouTube Credentials
        shell: bash
        run: |
          PLATFORMS_INPUT="${{ github.event.inputs.platforms }}"

          if [ -z "$PLATFORMS_INPUT" ]; then
            PLATFORMS_INPUT="$DEFAULT_PLATFORMS"
          fi

          if [[ ",$PLATFORMS_INPUT," == *",youtube,"* ]]; then
            python check_channel.py
          else
            echo "YouTube not selected; skipping credential check."
          fi

      - name: Run Headless Upload
        shell: bash
        run: |
          PLATFORMS_INPUT="${{ github.event.inputs.platforms }}"
          DRY_RUN_INPUT="${{ github.event.inputs.dry_run }}"

          if [ -z "$PLATFORMS_INPUT" ]; then
            PLATFORMS_INPUT="$DEFAULT_PLATFORMS"
          fi

          EXTRA_ARGS=""
          if [ "$DRY_RUN_INPUT" = "true" ]; then
            EXTRA_ARGS="--dry-run"
          fi

          python cron_headless_upload.py --random-one --platforms "$PLATFORMS_INPUT" $EXTRA_ARGS

      - name: Push Metadata Updates to Google Drive
        if: ${{ github.event.inputs.dry_run != 'true' && env.GOOGLE_DRIVE_METADATA_FOLDER_URL != '' }}
        shell: bash
        run: |
          if [ -z "$UPLOADER_METADATA_FOLDER" ] || [ ! -d "$UPLOADER_METADATA_FOLDER" ]; then
            echo "Resolved metadata folder missing: $UPLOADER_METADATA_FOLDER"
            exit 1
          fi

          python drive_folder_sync.py push \
            --folder-url "$GOOGLE_DRIVE_METADATA_FOLDER_URL" \
            --src "$UPLOADER_METADATA_FOLDER" \
            --service-account-json "$DRIVE_SERVICE_ACCOUNT_PATH" \
            --extensions .json

      - name: Commit Metadata Updates
        if: ${{ github.event.inputs.dry_run != 'true' && env.GOOGLE_DRIVE_METADATA_FOLDER_URL == '' }}
        shell: bash
        run: |
          if [ -z "$UPLOADER_METADATA_FOLDER" ]; then
            echo "UPLOADER_METADATA_FOLDER is not set; skipping commit."
            exit 0
          fi

          META_DIR="$UPLOADER_METADATA_FOLDER"
          if [[ "$META_DIR" = "$GITHUB_WORKSPACE"* ]]; then
            META_DIR="${META_DIR#$GITHUB_WORKSPACE/}"
          fi

          if [ ! -d "$META_DIR" ]; then
            echo "Metadata directory does not exist in workspace: $META_DIR"
            exit 0
          fi

          git add "$META_DIR"
          if git diff --cached --quiet; then
            echo "No metadata changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update upload status [skip ci]"
          git push

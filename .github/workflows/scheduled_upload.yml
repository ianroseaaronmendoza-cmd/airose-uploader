name: Scheduled Upload (Headless)

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Comma-separated platforms (youtube,igfb,pinterest)"
        required: false
        default: "youtube,igfb,pinterest"
      pinterest_only:
        description: "Run Pinterest only and ignore the platforms field"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Run without uploading or writing metadata"
        required: false
        type: boolean
        default: false
  schedule:
    # GitHub Actions cron uses UTC. Runs every 6.15 hours (6 hours 9 minutes)
    # Each schedule slot uses a different preset:
    # 00:03 UTC -> faith preset
    # 06:12 UTC -> love preset
    # 12:21 UTC -> sentimental preset
    # 18:30 UTC -> neutral preset
    - cron: "3 0 * * *"
    - cron: "12 6 * * *"
    - cron: "21 12 * * *"
    - cron: "30 18 * * *"

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      UPLOADER_METADATA_FOLDER: ${{ vars.UPLOADER_METADATA_FOLDER }}
      UPLOADER_VIDEO_FOLDER: ${{ vars.UPLOADER_VIDEO_FOLDER }}
      GOOGLE_DRIVE_AUTH_FOLDER_URL: ${{ vars.GOOGLE_DRIVE_AUTH_FOLDER_URL }}
      GOOGLE_DRIVE_METADATA_FOLDER_URL: ${{ vars.GOOGLE_DRIVE_METADATA_FOLDER_URL }}
      GOOGLE_DRIVE_VIDEO_FOLDER_URL: ${{ vars.GOOGLE_DRIVE_VIDEO_FOLDER_URL }}
      DRIVE_SERVICE_ACCOUNT_PATH: google_service_account.json
      DEFAULT_PLATFORMS: youtube,igfb,pinterest
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
      AUTH_SYNC_GITHUB_TOKEN: ${{ secrets.AUTH_SYNC_GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-headless.txt

      - name: Materialize Auth Files
        env:
          YOUTUBE_CREDENTIALS_JSON_B64: ${{ secrets.YOUTUBE_CREDENTIALS_JSON_B64 }}
          YOUTUBE_TOKEN_PKL_B64: ${{ secrets.YOUTUBE_TOKEN_PKL_B64 }}
          META_CREDENTIALS_JSON_B64: ${{ secrets.META_CREDENTIALS_JSON_B64 }}
          PINTEREST_CREDENTIALS_JSON_B64: ${{ secrets.PINTEREST_CREDENTIALS_JSON_B64 }}
          PINTEREST_OAUTH_CREDENTIALS_JSON_B64: ${{ secrets.PINTEREST_OAUTH_CREDENTIALS_JSON_B64 }}
          PINTEREST_OAUTH_TOKEN_JSON_B64: ${{ secrets.PINTEREST_OAUTH_TOKEN_JSON_B64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_DRIVE_AUTH_FOLDER_URL: ${{ vars.GOOGLE_DRIVE_AUTH_FOLDER_URL }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import base64
          import binascii
          import json
          import os
          from pathlib import Path

          required_mappings = {
              "YOUTUBE_CREDENTIALS_JSON_B64": ("credentials.json", "json"),
              "META_CREDENTIALS_JSON_B64": ("meta_credentials.json", "json"),
          }
          bootstrap_mappings = {
              "YOUTUBE_TOKEN_PKL_B64": ("token.pkl", "binary"),
              "PINTEREST_CREDENTIALS_JSON_B64": ("pinterest_credentials.json", "json"),
          }
          optional_mappings = {
              "PINTEREST_OAUTH_CREDENTIALS_JSON_B64": ("pinterest_oauth_credentials.json", "json"),
              "PINTEREST_OAUTH_TOKEN_JSON_B64": ("pinterest_oauth_token.json", "json"),
              "GOOGLE_SERVICE_ACCOUNT_JSON_B64": ("google_service_account.json", "json"),
          }

          use_drive_auth_cache = bool((os.environ.get("GOOGLE_DRIVE_AUTH_FOLDER_URL") or "").strip())
          mappings = dict(required_mappings)
          if use_drive_auth_cache:
              optional_mappings = {**bootstrap_mappings, **optional_mappings}
          else:
              mappings.update(bootstrap_mappings)

          def decode_secret(env_key: str, value_kind: str) -> bytes | None:
              value = (os.environ.get(env_key) or "").strip()
              if not value:
                  return None

              if value_kind == "json" and value[:1] in "{[":
                  try:
                      json.loads(value)
                  except json.JSONDecodeError as exc:
                      raise SystemExit(
                          f"GitHub Secret {env_key} looks like raw JSON but is invalid: {exc}"
                      ) from exc
                  return value.encode("utf-8")

              try:
                  return base64.b64decode(value, validate=True)
              except binascii.Error as exc:
                  if value_kind == "json":
                      raise SystemExit(
                          f"GitHub Secret {env_key} is invalid. "
                          "Provide either raw JSON text or the full single-line base64 value."
                      ) from exc
                  raise SystemExit(
                      f"GitHub Secret {env_key} is invalid base64. "
                      "Recreate it from the original file bytes and paste the full single-line value."
                  ) from exc

          missing = [key for key in mappings if not (os.environ.get(key) or "").strip()]
          if missing:
              raise SystemExit(
                  "Missing required GitHub Secrets: " + ", ".join(sorted(missing))
              )

          for env_key, (file_path, value_kind) in mappings.items():
              raw = decode_secret(env_key, value_kind)
              if raw is None:
                  raise SystemExit(f"Missing required GitHub Secret: {env_key}")
              Path(file_path).write_bytes(raw)
              print(f"Wrote {file_path}")

          for env_key, (file_path, value_kind) in optional_mappings.items():
              raw = decode_secret(env_key, value_kind)
              if raw is None:
                  continue
              Path(file_path).write_bytes(raw)
              print(f"Wrote {file_path}")
          PY

      - name: Normalize Drive Config
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          meta_path = Path("meta_credentials.json")
          service_account_path = Path("google_service_account.json")
          if not meta_path.exists() or not service_account_path.exists():
              raise SystemExit(0)

          data = json.loads(meta_path.read_text(encoding="utf-8"))
          desired = service_account_path.name
          if data.get("google_service_account_json") == desired:
              raise SystemExit(0)

          data["google_service_account_json"] = desired
          meta_path.write_text(json.dumps(data, indent=2), encoding="utf-8")
          print("Updated meta_credentials.json to use google_service_account.json")
          PY

      - name: Sync Auth Cache from Google Drive
        if: ${{ env.GOOGLE_DRIVE_AUTH_FOLDER_URL != '' }}
        shell: bash
        run: |
          if [ ! -f "$DRIVE_SERVICE_ACCOUNT_PATH" ]; then
            echo "GOOGLE_SERVICE_ACCOUNT_JSON_B64 secret is required for Google Drive auth cache sync."
            exit 1
          fi

          AUTH_CACHE_DIR="$GITHUB_WORKSPACE/.runtime/auth-cache"
          mkdir -p "$AUTH_CACHE_DIR"
          python drive_folder_sync.py pull \
            --folder-url "$GOOGLE_DRIVE_AUTH_FOLDER_URL" \
            --dest "$AUTH_CACHE_DIR" \
            --service-account-json "$DRIVE_SERVICE_ACCOUNT_PATH" \
            --extensions .json,.pkl \
            --clear-dest

          for name in token.pkl pinterest_credentials.json pinterest_oauth_credentials.json pinterest_oauth_token.json; do
            if [ -f "$AUTH_CACHE_DIR/$name" ]; then
              cp "$AUTH_CACHE_DIR/$name" "$GITHUB_WORKSPACE/$name"
              echo "Restored $name from Google Drive auth cache."
            fi
          done

      - name: Sync Google Drive Folders
        if: ${{ env.GOOGLE_DRIVE_METADATA_FOLDER_URL != '' || env.GOOGLE_DRIVE_VIDEO_FOLDER_URL != '' }}
        shell: bash
        run: |
          if [ ! -f "$DRIVE_SERVICE_ACCOUNT_PATH" ]; then
            echo "GOOGLE_SERVICE_ACCOUNT_JSON_B64 secret is required for Google Drive folder sync."
            exit 1
          fi

          if [ -n "$GOOGLE_DRIVE_METADATA_FOLDER_URL" ]; then
            METADATA_DIR="$GITHUB_WORKSPACE/.runtime/metadata"
            mkdir -p "$METADATA_DIR"
            python drive_folder_sync.py pull \
              --folder-url "$GOOGLE_DRIVE_METADATA_FOLDER_URL" \
              --dest "$METADATA_DIR" \
              --service-account-json "$DRIVE_SERVICE_ACCOUNT_PATH" \
              --extensions .json \
              --clear-dest
            echo "UPLOADER_METADATA_FOLDER=$METADATA_DIR" >> "$GITHUB_ENV"
          fi

          if [ -n "$GOOGLE_DRIVE_VIDEO_FOLDER_URL" ]; then
            VIDEO_DIR="$GITHUB_WORKSPACE/.runtime/videos"
            mkdir -p "$VIDEO_DIR"
            python drive_folder_sync.py pull \
              --folder-url "$GOOGLE_DRIVE_VIDEO_FOLDER_URL" \
              --dest "$VIDEO_DIR" \
              --service-account-json "$DRIVE_SERVICE_ACCOUNT_PATH" \
              --extensions .mp4,.mov,.m4v \
              --clear-dest
            echo "UPLOADER_VIDEO_FOLDER=$VIDEO_DIR" >> "$GITHUB_ENV"
          fi

      - name: Resolve Effective Platforms
        shell: bash
        run: |
          PLATFORMS_INPUT="${{ github.event.inputs.platforms }}"
          PINTEREST_ONLY_INPUT="${{ github.event.inputs.pinterest_only }}"
          mkdir -p .runtime/logs
          YT_AUTH_LOG=".runtime/logs/youtube_auth.log"
          PIN_AUTH_LOG=".runtime/logs/pinterest_auth.log"
          : > "$YT_AUTH_LOG"
          : > "$PIN_AUTH_LOG"
          YOUTUBE_AUTH_FAILED="false"
          YOUTUBE_AUTH_REASON=""
          PINTEREST_AUTH_FAILED="false"
          PINTEREST_AUTH_REASON=""

          if [ -z "$PLATFORMS_INPUT" ]; then
            PLATFORMS_INPUT="$DEFAULT_PLATFORMS"
          fi

          if [ "$PINTEREST_ONLY_INPUT" = "true" ]; then
            EFFECTIVE_PLATFORMS="pinterest"
            echo "Pinterest-only run requested; overriding platforms to pinterest."
          else
            EFFECTIVE_PLATFORMS="$PLATFORMS_INPUT"
          fi

          if [[ ",$EFFECTIVE_PLATFORMS," == *",youtube,"* ]]; then
            set +e
            python refresh_youtube_token.py --no-interactive 2>&1 | tee -a "$YT_AUTH_LOG"
            REFRESH_EXIT=${PIPESTATUS[0]}
            if [ $REFRESH_EXIT -eq 0 ]; then
              python check_channel.py 2>&1 | tee -a "$YT_AUTH_LOG"
              CHECK_EXIT=${PIPESTATUS[0]}
            else
              CHECK_EXIT=$REFRESH_EXIT
            fi
            set -e

            if [ $CHECK_EXIT -ne 0 ]; then
              YOUTUBE_AUTH_FAILED="true"
              YOUTUBE_AUTH_REASON="refresh_or_channel_check_failed"
              echo "::error::YouTube auth failed. The saved refresh token may be expired, revoked, or missing. Run local YouTube OAuth again. Routine token persistence can be automated via GOOGLE_DRIVE_AUTH_FOLDER_URL or AUTH_SYNC_GITHUB_TOKEN."
              echo "YouTube auth failed; removing youtube from this run."
              {
                echo "## YouTube Auth Failure"
                echo
                echo "- Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
                echo "- Reason: refresh_or_channel_check_failed"
                echo "- Action: run local YouTube OAuth again, then refresh the stored auth cache (`YOUTUBE_TOKEN_PKL_B64` or Google Drive auth cache)"
                echo "- Log: \`$YT_AUTH_LOG\`"
              } >> "$GITHUB_STEP_SUMMARY"
              EFFECTIVE_PLATFORMS=$(python -c "import sys; print(','.join(item.strip() for item in sys.argv[1].split(',') if item.strip().lower() != 'youtube'))" "$EFFECTIVE_PLATFORMS")
            fi
          else
            echo "YouTube not selected; skipping auth checks."
          fi

          if [[ ",$EFFECTIVE_PLATFORMS," == *",pinterest,"* ]]; then
            if [ ! -f "pinterest_oauth_credentials.json" ] || [ ! -f "pinterest_oauth_token.json" ]; then
              PINTEREST_AUTH_FAILED="true"
              PINTEREST_AUTH_REASON="oauth_refresh_config_missing"
              echo "::error::Pinterest OAuth refresh config missing. Add PINTEREST_OAUTH_CREDENTIALS_JSON_B64 and PINTEREST_OAUTH_TOKEN_JSON_B64."
              echo "Pinterest auth refresh config missing; removing pinterest from this run."
              {
                echo "## Pinterest Auth Failure"
                echo
                echo "- Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
                echo "- Reason: oauth_refresh_config_missing"
                echo "- Action: update \`PINTEREST_OAUTH_CREDENTIALS_JSON_B64\` and \`PINTEREST_OAUTH_TOKEN_JSON_B64\`"
                echo "- Log: \`$PIN_AUTH_LOG\`"
              } >> "$GITHUB_STEP_SUMMARY"
              EFFECTIVE_PLATFORMS=$(python -c "import sys; print(','.join(item.strip() for item in sys.argv[1].split(',') if item.strip().lower() != 'pinterest'))" "$EFFECTIVE_PLATFORMS")
            else
              set +e
              python refresh_pinterest_token.py --no-interactive 2>&1 | tee -a "$PIN_AUTH_LOG"
              PIN_REFRESH_EXIT=${PIPESTATUS[0]}
              set -e

              if [ $PIN_REFRESH_EXIT -ne 0 ]; then
                PINTEREST_AUTH_FAILED="true"
                PINTEREST_AUTH_REASON="refresh_failed"
                echo "::error::Pinterest auth refresh failed. Run local Pinterest OAuth again. Routine token persistence can be automated via GOOGLE_DRIVE_AUTH_FOLDER_URL or AUTH_SYNC_GITHUB_TOKEN."
                echo "Pinterest auth failed; removing pinterest from this run."
                {
                  echo "## Pinterest Auth Failure"
                  echo
                  echo "- Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
                  echo "- Reason: refresh_failed"
                  echo "- Action: run local Pinterest OAuth again, then refresh the stored auth cache (`PINTEREST_OAUTH_TOKEN_JSON_B64` or Google Drive auth cache)"
                  echo "- Log: \`$PIN_AUTH_LOG\`"
                } >> "$GITHUB_STEP_SUMMARY"
                EFFECTIVE_PLATFORMS=$(python -c "import sys; print(','.join(item.strip() for item in sys.argv[1].split(',') if item.strip().lower() != 'pinterest'))" "$EFFECTIVE_PLATFORMS")
              fi
            fi
          else
            echo "Pinterest not selected; skipping auth refresh."
          fi

          if [ -z "$EFFECTIVE_PLATFORMS" ]; then
            echo "No runnable platforms remain after auth fallback."
            exit 1
          fi

          echo "YOUTUBE_AUTH_FAILED=$YOUTUBE_AUTH_FAILED" >> "$GITHUB_ENV"
          echo "YOUTUBE_AUTH_REASON=$YOUTUBE_AUTH_REASON" >> "$GITHUB_ENV"
          echo "YOUTUBE_AUTH_LOG=$YT_AUTH_LOG" >> "$GITHUB_ENV"
          echo "PINTEREST_AUTH_FAILED=$PINTEREST_AUTH_FAILED" >> "$GITHUB_ENV"
          echo "PINTEREST_AUTH_REASON=$PINTEREST_AUTH_REASON" >> "$GITHUB_ENV"
          echo "PINTEREST_AUTH_LOG=$PIN_AUTH_LOG" >> "$GITHUB_ENV"
          echo "EFFECTIVE_PLATFORMS=$EFFECTIVE_PLATFORMS" >> "$GITHUB_ENV"
          echo "Effective platforms: $EFFECTIVE_PLATFORMS"

      - name: Sync Refreshed Auth Secrets to GitHub
        if: ${{ env.AUTH_SYNC_GITHUB_TOKEN != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ env.AUTH_SYNC_GITHUB_TOKEN }}
        shell: bash
        run: |
          sync_secret() {
            local secret_name="$1"
            local file_path="$2"

            if [ ! -f "$file_path" ]; then
              echo "Skipping $secret_name; file not found: $file_path"
              return 0
            fi

            gh secret set "$secret_name" \
              --repo "$GITHUB_REPOSITORY" \
              --app actions \
              --body "$(base64 -w 0 "$file_path")"
            echo "Updated $secret_name from $file_path"
          }

          sync_secret "YOUTUBE_TOKEN_PKL_B64" "token.pkl"
          sync_secret "PINTEREST_CREDENTIALS_JSON_B64" "pinterest_credentials.json"
          sync_secret "PINTEREST_OAUTH_CREDENTIALS_JSON_B64" "pinterest_oauth_credentials.json"
          sync_secret "PINTEREST_OAUTH_TOKEN_JSON_B64" "pinterest_oauth_token.json"

      - name: Resolve Scheduled Preset
        shell: bash
        run: |
          EVENT_NAME="${{ github.event_name }}"
          EVENT_SCHEDULE="${{ github.event.schedule }}"
          RESOLVED_PRESET=""

          if [ "$EVENT_NAME" = "schedule" ]; then
            case "$EVENT_SCHEDULE" in
              "3 0 * * *")
                RESOLVED_PRESET="faith"
                ;;
              "12 6 * * *")
                RESOLVED_PRESET="love"
                ;;
              "21 12 * * *")
                RESOLVED_PRESET="sentimental"
                ;;
              "30 18 * * *")
                RESOLVED_PRESET="neutral"
                ;;
              *)
                echo "Unknown scheduled cron entry: $EVENT_SCHEDULE"
                exit 1
                ;;
            esac
          fi

          echo "RESOLVED_PRESET=$RESOLVED_PRESET" >> "$GITHUB_ENV"
          if [ -n "$RESOLVED_PRESET" ]; then
            echo "Resolved scheduled preset: $RESOLVED_PRESET"
          else
            echo "No scheduled preset override for event: $EVENT_NAME"
          fi

      - name: Notify YouTube Auth Failure
        if: ${{ env.YOUTUBE_AUTH_FAILED == 'true' && env.ALERT_WEBHOOK_URL != '' }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          webhook_url = os.environ["ALERT_WEBHOOK_URL"].strip()
          payload = {
              "text": (
                  "YouTube auth failed in scheduled_upload.yml. "
                  "Run local YouTube OAuth again. Routine refreshed token persistence "
                  "can be automated with GOOGLE_DRIVE_AUTH_FOLDER_URL or AUTH_SYNC_GITHUB_TOKEN."
              ),
              "workflow": "Scheduled Upload (Headless)",
              "reason": os.environ.get("YOUTUBE_AUTH_REASON", "unknown"),
              "repository": os.environ.get("GITHUB_REPOSITORY", ""),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "server_url": os.environ.get("GITHUB_SERVER_URL", "https://github.com"),
          }
          req = urllib.request.Request(
              webhook_url,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(req, timeout=20) as resp:
              print(f"Alert webhook responded with HTTP {resp.status}")
          PY

      - name: Notify Pinterest Auth Failure
        if: ${{ env.PINTEREST_AUTH_FAILED == 'true' && env.ALERT_WEBHOOK_URL != '' }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          webhook_url = os.environ["ALERT_WEBHOOK_URL"].strip()
          payload = {
              "text": (
                  "Pinterest auth refresh failed in scheduled_upload.yml. "
                  "Run local Pinterest OAuth again. Routine refreshed token persistence "
                  "can be automated with GOOGLE_DRIVE_AUTH_FOLDER_URL or AUTH_SYNC_GITHUB_TOKEN."
              ),
              "workflow": "Scheduled Upload (Headless)",
              "reason": os.environ.get("PINTEREST_AUTH_REASON", "unknown"),
              "repository": os.environ.get("GITHUB_REPOSITORY", ""),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "server_url": os.environ.get("GITHUB_SERVER_URL", "https://github.com"),
          }
          req = urllib.request.Request(
              webhook_url,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(req, timeout=20) as resp:
              print(f"Alert webhook responded with HTTP {resp.status}")
          PY

      - name: Run Headless Upload
        shell: bash
        run: |
          DRY_RUN_INPUT="${{ github.event.inputs.dry_run }}"

          EXTRA_ARGS=""
          if [ "$DRY_RUN_INPUT" = "true" ]; then
            EXTRA_ARGS="--dry-run"
          fi

          PRESET_ARGS=""
          if [ -n "$RESOLVED_PRESET" ]; then
            PRESET_ARGS="--preset $RESOLVED_PRESET"
          fi

          python cron_headless_upload.py --random-one --platforms "$EFFECTIVE_PLATFORMS" $PRESET_ARGS $EXTRA_ARGS

      - name: Persist Auth Cache to Google Drive
        if: ${{ always() && env.GOOGLE_DRIVE_AUTH_FOLDER_URL != '' }}
        shell: bash
        run: |
          if [ ! -f "$DRIVE_SERVICE_ACCOUNT_PATH" ]; then
            echo "GOOGLE_SERVICE_ACCOUNT_JSON_B64 secret is required for Google Drive auth cache sync."
            exit 1
          fi

          AUTH_CACHE_DIR="$GITHUB_WORKSPACE/.runtime/auth-cache"
          mkdir -p "$AUTH_CACHE_DIR"
          find "$AUTH_CACHE_DIR" -maxdepth 1 -type f \( -name '*.json' -o -name '*.pkl' \) -delete

          for name in token.pkl pinterest_credentials.json pinterest_oauth_credentials.json pinterest_oauth_token.json; do
            if [ -f "$GITHUB_WORKSPACE/$name" ]; then
              cp "$GITHUB_WORKSPACE/$name" "$AUTH_CACHE_DIR/$name"
              echo "Prepared $name for Google Drive auth cache sync."
            fi
          done

          if ! find "$AUTH_CACHE_DIR" -maxdepth 1 -type f \( -name '*.json' -o -name '*.pkl' \) | grep -q .; then
            echo "No auth cache files available to sync."
            exit 0
          fi

          python drive_folder_sync.py push \
            --folder-url "$GOOGLE_DRIVE_AUTH_FOLDER_URL" \
            --src "$AUTH_CACHE_DIR" \
            --service-account-json "$DRIVE_SERVICE_ACCOUNT_PATH" \
            --extensions .json,.pkl

      - name: Push Metadata Updates to Google Drive
        if: ${{ github.event.inputs.dry_run != 'true' && env.GOOGLE_DRIVE_METADATA_FOLDER_URL != '' }}
        shell: bash
        run: |
          if [ -z "$UPLOADER_METADATA_FOLDER" ] || [ ! -d "$UPLOADER_METADATA_FOLDER" ]; then
            echo "Resolved metadata folder missing: $UPLOADER_METADATA_FOLDER"
            exit 1
          fi

          python drive_folder_sync.py push \
            --folder-url "$GOOGLE_DRIVE_METADATA_FOLDER_URL" \
            --src "$UPLOADER_METADATA_FOLDER" \
            --service-account-json "$DRIVE_SERVICE_ACCOUNT_PATH" \
            --extensions .json

      - name: Commit Metadata Updates
        if: ${{ github.event.inputs.dry_run != 'true' && env.GOOGLE_DRIVE_METADATA_FOLDER_URL == '' }}
        shell: bash
        run: |
          if [ -z "$UPLOADER_METADATA_FOLDER" ]; then
            echo "UPLOADER_METADATA_FOLDER is not set; skipping commit."
            exit 0
          fi

          META_DIR="$UPLOADER_METADATA_FOLDER"
          if [[ "$META_DIR" = "$GITHUB_WORKSPACE"* ]]; then
            META_DIR="${META_DIR#$GITHUB_WORKSPACE/}"
          fi

          if [ ! -d "$META_DIR" ]; then
            echo "Metadata directory does not exist in workspace: $META_DIR"
            exit 0
          fi

          git add "$META_DIR"
          if git diff --cached --quiet; then
            echo "No metadata changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update upload status [skip ci]"
          git push

